name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            FrontEnd/kulcs-rendszer-frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install root dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        run: npm ci --prefix FrontEnd/kulcs-rendszer-frontend

      - name: Run style checks
        run: npm run check:all

      - name: Build and start Docker stack
        run: docker compose up --build -d
      - name: Test
        working-directory: ./BackEnd
        run: dotnet test --verbosity normal /p:TreatWarningsAsErrors=false
